name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      # ==========================================
      # ENABLE RDP
      # ==========================================
      - name: Configure RDP
        shell: powershell
        run: |
          Write-Host "Enabling Remote Desktop..."

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "SecurityLayer" `
            -Value 0 `
            -Force

          # Enable Windows RDP firewall rules
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          # Extra RDP firewall rule
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          Restart-Service TermService -Force

          Write-Host "RDP enabled successfully."

      # ==========================================
      # CREATE RDP USER
      # ==========================================
      - name: Create RDP User
        shell: powershell
        run: |

          $username = "RDP"

          # ======================================
          # PASSWORD TETAP
          # TIDAK DIGENERATOR
          # ======================================
          $password = "Zx7!Qp9@Lm4#Vr8$Nt2%K"

          Write-Host "Preparing RDP account..."

          # --------------------------------------
          # Remove existing account
          # --------------------------------------
          net user $username /delete 2>$null

          Start-Sleep -Seconds 2

          # --------------------------------------
          # Create account using NET USER
          # --------------------------------------
          net user $username $password /add /y

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to create RDP account."
              exit 1
          }

          # --------------------------------------
          # Password never expires
          # --------------------------------------
          net user $username /passwordchg:no
          net user $username /expires:never

          # --------------------------------------
          # Add Administrator
          # --------------------------------------
          net localgroup Administrators $username /add

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to add user to Administrators."
              exit 1
          }

          # --------------------------------------
          # Add Remote Desktop Users
          # --------------------------------------
          net localgroup "Remote Desktop Users" $username /add

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to add user to Remote Desktop Users."
              exit 1
          }

          # --------------------------------------
          # Verify user
          # --------------------------------------
          $check = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if (-not $check) {
              Write-Error "RDP user was not created."
              exit 1
          }

          # Environment variables
          "RDP_USERNAME=$username" >> $env:GITHUB_ENV
          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "======================================"
          Write-Host "RDP USER CREATED"
          Write-Host "======================================"
          Write-Host "Username: $username"
          Write-Host "======================================"

      # ==========================================
      # INSTALL TAILSCALE
      # ==========================================
      - name: Install Tailscale
        shell: powershell
        run: |

          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"

          Write-Host "Downloading Tailscale..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          Write-Host "Installing Tailscale..."

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i", "`"$installer`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item $installer -Force

          Write-Host "Tailscale installed."

      # ==========================================
      # CONNECT TAILSCALE
      # ==========================================
      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
              Write-Error "Tailscale executable not found."
              exit 1
          }

          Write-Host "Connecting Tailscale..."

          & $tailscale up `
            --authkey="$env:TAILSCALE_AUTH_KEY" `
            --hostname="gh-runner-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Tailscale connection failed."
              exit 1
          }

          Write-Host "Waiting for Tailscale IP..."

          $tsIP = $null

          for ($i = 1; $i -le 20; $i++) {

              $tsIP = (& $tailscale ip -4 2>$null |
                Select-Object -First 1).Trim()

              if ($tsIP) {
                  break
              }

              Write-Host "Waiting for IP... $i/20"
              Start-Sleep -Seconds 3
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP was not assigned."
              exit 1
          }

          Write-Host "Tailscale IP: $tsIP"

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      # ==========================================
      # VERIFY RDP
      # ==========================================
      - name: Verify RDP
        shell: powershell
        run: |

          Write-Host "Testing RDP port..."

          $result = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $result.TcpTestSucceeded) {
              Write-Error "RDP port 3389 is not reachable."
              exit 1
          }

          Write-Host "RDP port 3389 is OPEN."

      # ==========================================
      # SHOW RDP INFORMATION
      # ==========================================
      - name: RDP Information
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "             RDP IS READY"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "Address  : $env:TAILSCALE_IP"
          Write-Host "Port     : 3389"
          Write-Host "Username : $env:RDP_USERNAME"
          Write-Host "Password : $env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "=========================================="
          Write-Host ""

      # ==========================================
      # KEEP RUNNER ALIVE
      # ==========================================
      - name: Keep RDP Alive
        shell: powershell
        run: |

          Write-Host "RDP is active."

          while ($true) {

              Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RDP Active - $env:TAILSCALE_IP"

              Start-Sleep -Seconds 300
          }
