name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      # ==========================================
      # ENABLE RDP
      # ==========================================
      - name: Configure RDP
        shell: powershell
        run: |
          Write-Host "Enabling Remote Desktop..."

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" `
            -Value 0 `
            -Force

          # Enable Windows Firewall rule
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          # Ensure port 3389 is allowed
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          Restart-Service TermService -Force

          Write-Host "RDP enabled."

      # ==========================================
      # CREATE RDP USER
      # ==========================================
      - name: Create RDP User
        shell: powershell
        run: |
          $username = "RDP"

          # ======================================
          # PASSWORD TETAP
          # ======================================
          $password = "DoaRdp#2026!SecureX9"

          Write-Host "Creating RDP account..."

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          # Cek apakah user sudah ada
          $user = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($user) {

              Write-Host "RDP user already exists."

              # Update password
              Set-LocalUser `
                -Name $username `
                -Password $securePassword

          } else {

              Write-Host "Creating new RDP user..."

              New-LocalUser `
                -Name $username `
                -Password $securePassword `
                -Description "GitHub Actions RDP User" `
                -AccountNeverExpires `
                -PasswordNeverExpires `
                -UserMayNotChangePassword
          }

          # Administrator
          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username `
            -ErrorAction SilentlyContinue

          # Remote Desktop Users
          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          # Environment variables
          "RDP_USERNAME=$username" >> $env:GITHUB_ENV
          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

          # Verify account
          $check = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if (-not $check) {
              Write-Error "Failed to create RDP user."
              exit 1
          }

          Write-Host "RDP account ready."

      # ==========================================
      # INSTALL TAILSCALE
      # ==========================================
      - name: Install Tailscale
        shell: powershell
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"

          Write-Host "Downloading Tailscale..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          Write-Host "Installing Tailscale..."

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i", "`"$installer`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item $installer -Force

          Write-Host "Tailscale installed."

      # ==========================================
      # CONNECT TAILSCALE
      # ==========================================
      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
              Write-Error "Tailscale executable not found."
              exit 1
          }

          Write-Host "Connecting to Tailscale..."

          & $tailscale up `
            --authkey="$env:TAILSCALE_AUTH_KEY" `
            --hostname="gh-runner-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Tailscale connection failed."
              exit 1
          }

          Write-Host "Waiting for Tailscale IP..."

          $tsIP = $null

          for ($i = 1; $i -le 20; $i++) {

              $tsIP = (& $tailscale ip -4 2>$null | Select-Object -First 1).Trim()

              if ($tsIP) {
                  break
              }

              Write-Host "Waiting... attempt $i/20"
              Start-Sleep -Seconds 3
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP was not assigned."
              exit 1
          }

          Write-Host "Tailscale IP: $tsIP"

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      # ==========================================
      # TEST RDP
      # ==========================================
      - name: Verify RDP
        shell: powershell
        run: |
          Write-Host "Testing RDP..."

          $result = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $result.TcpTestSucceeded) {
              Write-Error "RDP port 3389 is not reachable."
              exit 1
          }

          Write-Host "RDP connection test successful!"

      # ==========================================
      # SHOW CONNECTION INFORMATION
      # ==========================================
      - name: RDP Information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "           RDP IS READY"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "Address  : $env:TAILSCALE_IP"
          Write-Host "Port     : 3389"
          Write-Host "Username : $env:RDP_USERNAME"
          Write-Host "Password : $env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Connect using Windows Remote Desktop."
          Write-Host "=========================================="
          Write-Host ""

      # ==========================================
      # KEEP RUNNER ALIVE
      # ==========================================
      - name: Keep RDP Alive
        shell: powershell
        run: |
          Write-Host "RDP runner is active."

          while ($true) {
              Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RDP Active - $env:TAILSCALE_IP"
              Start-Sleep -Seconds 300
          }
